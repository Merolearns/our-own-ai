{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block content %}
<section class="chat" data-agent="{{ brand.name }}">
  <header class="chat-head">
    <h1>{{ brand.chat_heading }}</h1>
    <form method="post" action="{{ url_for('new_chat') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="quiet">New chat</button>
    </form>
  </header>
  <div id="log" class="log" aria-live="polite"></div>
  <div id="starters" class="starters" hidden>
    {% if brand.id == "scoopy" %}
    <button class="quiet" data-prompt="What do Scoopy Doog plans cost per month?">What do plans cost?</button>
    <button class="quiet" data-prompt="What happens when the technician visits my yard?">What happens on a visit?</button>
    <button class="quiet" data-prompt="Please call me back about a quote for my yard.">Ask for a call back</button>
    {% else %}
    <button class="quiet" data-prompt="What is your refund policy?">What is your refund policy?</button>
    <button class="quiet" data-prompt="Where is order #1001?">Where is order #1001?</button>
    <button class="quiet" data-prompt="I'd like a refund for order #1006, the parcel arrived damaged.">Refund a damaged parcel</button>
    {% endif %}
  </div>
  <form id="composer" class="composer">
    <label class="sr" for="message">{{ brand.composer_label }}</label>
    <textarea id="message" rows="1" maxlength="8000" placeholder="{{ brand.composer_placeholder }}" required></textarea>
    <button class="primary" id="send">Send</button>
  </form>
</section>
<script type="application/json" id="history">{{ history|tojson }}</script>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='chat.js') }}"></script>{% endblock %}
